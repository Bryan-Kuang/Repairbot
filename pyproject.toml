[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-repairbot"
version = "0.1.0"
description = "Discord incident triage and multi-provider automated GitHub repair"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.4,<3"]

[project.scripts]
repairbot = "repairbot.__main__:main"

[tool.setuptools.packages.find]
include = ["repairbot*"]
